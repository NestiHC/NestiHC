<svg xmlns="http://www.w3.org/2000/svg" width="640" height="92" viewBox="0 0 640 92" role="img" aria-label="Un programador dice: «En mi máquina funciona». Y así nacieron los contenedores."><rect x="1.5" y="1.5" width="637" height="89" rx="12" fill="none" stroke="#0E7490" stroke-width="3"/><text x="24" y="36" font-family="Fira Code, Consolas, Menlo, monospace" font-size="15" fill="#1f2328">Un programador dice: «En mi máquina funciona». Y así</text><text x="24" y="60" font-family="Fira Code, Consolas, Menlo, monospace" font-size="15" fill="#1f2328">nacieron los contenedores.</text></svg>