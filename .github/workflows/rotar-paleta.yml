name: Rotar paleta del perfil

on:
  # Cada hora, en punto. GitHub puede retrasar unos minutos las ejecuciones programadas.
  schedule:
    - cron: "0 * * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions (necesario la primera vez)
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opta por Node 24 en las acciones de JavaScript (Node 20 ya fue retirado de los runners)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rotar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Elegir paleta y generar las imágenes
        run: |
          set -euo pipefail
          mkdir -p dist

          # Paletas: banner (degradado), pie de página (degradado invertido) y color del texto animado,
          # en versión oscura (D) y clara (L)
          PALETAS=(bosque oceano atardecer aurora)
          NOMBRE=${PALETAS[$((RANDOM % ${#PALETAS[@]}))]}

          case "$NOMBRE" in
            bosque)
              BD="0:0b1f14,50:14532d,100:4ade80"; BL="0:14532d,50:2f855a,100:a7f3d0"
              FD="0:4ade80,50:14532d,100:0b1f14"; FL="0:a7f3d0,50:2f855a,100:14532d"
              TD="86EFAC"; TL="166534" ;;
            oceano)
              BD="0:03111f,50:0b3c5d,100:22d3ee"; BL="0:0c4a6e,50:0891b2,100:a5f3fc"
              FD="0:22d3ee,50:0b3c5d,100:03111f"; FL="0:a5f3fc,50:0891b2,100:0c4a6e"
              TD="67E8F9"; TL="0E7490" ;;
            atardecer)
              BD="0:1e1b4b,50:9d174d,100:fb923c"; BL="0:be123c,50:ea580c,100:fde68a"
              FD="0:fb923c,50:9d174d,100:1e1b4b"; FL="0:fde68a,50:ea580c,100:be123c"
              TD="FDBA74"; TL="C2410C" ;;
            aurora)
              BD="0:0f172a,50:0d9488,100:a78bfa"; BL="0:0f766e,50:14b8a6,100:c4b5fd"
              FD="0:a78bfa,50:0d9488,100:0f172a"; FL="0:c4b5fd,50:14b8a6,100:0f766e"
              TD="5EEAD4"; TL="0F766E" ;;
          esac
          echo "Paleta elegida: $NOMBRE"

          # Banner (capsule-render): texto en español e inglés
          BANNER='https://capsule-render.vercel.app/api?type=waving&height=200&section=header&text=NestiHC&fontSize=64&fontColor=ffffff&animation=fadeIn&fontAlignY=38&descAlignY=60&descSize=18'
          DESC_ES='Control%20no%20lineal%20%7C%20Sistemas%20inteligentes%20%7C%20LaTeX'
          DESC_EN='Nonlinear%20control%20%7C%20Intelligent%20systems%20%7C%20LaTeX'

          # Pie de página (capsule-render): sin texto, es el mismo para los dos idiomas
          FOOTER='https://capsule-render.vercel.app/api?type=waving&height=100&section=footer'

          # Texto animado (readme-typing-svg): español e inglés
          TYPING='https://readme-typing-svg.demolab.com?font=Fira+Code&weight=600&size=20&duration=3000&pause=1000&center=true&vCenter=true&width=540&height=60'
          LINEAS_ES='%C2%A1Hola!+Soy+NestiHC+%F0%9F%91%8B;Maestr%C3%ADa+en+Electr%C3%B3nica+%F0%9F%8E%93;Controlando+lo+no+lineal+(y+mi+caf%C3%A9+%E2%98%95);Instructor+en+Robotica76+%F0%9F%A4%96;Escribo+apuntes+en+LaTeX+%E2%9C%8D%EF%B8%8F;Si+compila+a+la+primera%2C+sospecha+%F0%9F%98%85;Siempre+aprendiendo+%F0%9F%9A%80'
          LINEAS_EN='Hi!+I%27m+NestiHC+%F0%9F%91%8B;Master%27s+in+Electronics+%F0%9F%8E%93;Controlling+the+nonlinear+(and+my+coffee+%E2%98%95);Instructor+at+Robotica76+%F0%9F%A4%96;Writing+notes+in+LaTeX+%E2%9C%8D%EF%B8%8F;If+it+compiles+on+the+first+try%2C+be+suspicious+%F0%9F%98%85;Always+learning+%F0%9F%9A%80'

          descargar() {
            curl -fsSL --retry 3 --retry-delay 5 -o "dist/$1" "$2"
            # Si el servicio devolvió algo que no es un SVG, se cancela sin tocar lo que ya está publicado
            grep -q '<svg' "dist/$1"
          }

          # Español (nombres originales, para no romper el README actual)
          descargar banner-dark.svg  "${BANNER}&desc=${DESC_ES}&color=${BD}"
          descargar banner-light.svg "${BANNER}&desc=${DESC_ES}&color=${BL}"
          descargar typing-dark.svg  "${TYPING}&color=${TD}&lines=${LINEAS_ES}"
          descargar typing-light.svg "${TYPING}&color=${TL}&lines=${LINEAS_ES}"

          # Inglés
          descargar banner-en-dark.svg  "${BANNER}&desc=${DESC_EN}&color=${BD}"
          descargar banner-en-light.svg "${BANNER}&desc=${DESC_EN}&color=${BL}"
          descargar typing-en-dark.svg  "${TYPING}&color=${TD}&lines=${LINEAS_EN}"
          descargar typing-en-light.svg "${TYPING}&color=${TL}&lines=${LINEAS_EN}"

          # Pie de página (los dos idiomas lo comparten)
          descargar footer-dark.svg  "${FOOTER}&color=${FD}"
          descargar footer-light.svg "${FOOTER}&color=${FL}"

          # Botón "volver arriba": toma el color de la paleta (oscura -> TD, clara -> TL)
          TOP='https://img.shields.io/badge'
          descargar top-es-dark.svg  "${TOP}/%E2%AC%86%EF%B8%8F_Volver_arriba-${TD}?style=for-the-badge"
          descargar top-es-light.svg "${TOP}/%E2%AC%86%EF%B8%8F_Volver_arriba-${TL}?style=for-the-badge"
          descargar top-en-dark.svg  "${TOP}/%E2%AC%86%EF%B8%8F_Back_to_top-${TD}?style=for-the-badge"
          descargar top-en-light.svg "${TOP}/%E2%AC%86%EF%B8%8F_Back_to_top-${TL}?style=for-the-badge"

          # Chiste al azar (en español e inglés, el mismo en ambos), dibujado con la paleta del momento
          python3 - "$TD" "$TL" <<'PY'
          import html
          import pathlib
          import random
          import sys
          import textwrap

          acento_oscuro, acento_claro = sys.argv[1:3]

          CHISTES = [
              ("¿Por qué los programadores confunden Halloween con Navidad? Porque 31 en octal es 25 en decimal.",
               "Why do programmers confuse Halloween and Christmas? Because 31 in octal is 25 in decimal."),
              ("Un ingeniero de control entra a un bar... y se queda oscilando en la puerta.",
               "A control engineer walks into a bar... and keeps oscillating in the doorway."),
              ("En teoría, teoría y práctica son lo mismo. En la práctica, no.",
               "In theory, theory and practice are the same. In practice, they are not."),
              ("Hay 10 tipos de personas: las que entienden binario y las que no.",
               "There are 10 types of people: those who understand binary and those who do not."),
              ("Mi código funciona y no sé por qué. Mi código no funciona y tampoco sé por qué.",
               "My code works and I do not know why. My code does not work and I do not know why either."),
              ("Un amplificador operacional entra a un bar y dice: «Me siento saturado».",
               "An op-amp walks into a bar and says: \"I feel saturated.\""),
              ("Un ingeniero de control nunca discute: solo busca estabilidad.",
               "A control engineer never argues: they just look for stability."),
              ("No confíes en los átomos: se inventan todo.",
               "Never trust atoms: they make up everything."),
              ("Un programador dice: «En mi máquina funciona». Y así nacieron los contenedores.",
               "A programmer says: \"It works on my machine.\" And that is how containers were born."),
              ("¿Por qué los robots nunca se estresan? Porque tienen nervios de acero.",
               "Why are robots never stressed? Because they have nerves of steel."),
              ("Un bit le dice a otro: «Nos vemos en el siguiente flanco de subida».",
               "One bit says to another: \"See you on the next rising edge.\""),
              ("Lo único más difícil que depurar código es depurar el que escribiste hace seis meses.",
               "The only thing harder than debugging code is debugging code you wrote six months ago."),
              ("Mi PID está perfectamente sintonizado... hasta que cambia la planta.",
               "My PID is perfectly tuned... until the plant changes."),
              ("Mi microcontrolador y yo tenemos algo en común: los dos nos reiniciamos cuando algo sale mal.",
               "My microcontroller and I have something in common: we both reboot when things go wrong."),
              ("Terminar un medio maratón es más fácil que terminar un proyecto: al menos la meta está señalizada.",
               "Finishing a half marathon is easier than finishing a project: at least the finish line is marked."),
          ]
          es, en = random.choice(CHISTES)

          def tarjeta(texto, acento, color_texto):
              lineas = textwrap.wrap(texto, 60)
              alto = 28 + 24 * len(lineas) + 16
              filas = "".join(
                  f'<text x="24" y="{36 + 24 * i}" font-family="Fira Code, Consolas, Menlo, monospace" '
                  f'font-size="15" fill="#{color_texto}">{html.escape(l)}</text>'
                  for i, l in enumerate(lineas)
              )
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="640" height="{alto}" '
                  f'viewBox="0 0 640 {alto}" role="img" aria-label="{html.escape(texto)}">'
                  f'<rect x="1.5" y="1.5" width="637" height="{alto - 3}" rx="12" fill="none" '
                  f'stroke="#{acento}" stroke-width="3"/>{filas}</svg>'
              )

          salida = pathlib.Path("dist")
          for nombre, texto in (("chiste-es", es), ("joke-en", en)):
              (salida / f"{nombre}-dark.svg").write_text(tarjeta(texto, acento_oscuro, "e6edf3"), encoding="utf-8")
              (salida / f"{nombre}-light.svg").write_text(tarjeta(texto, acento_claro, "1f2328"), encoding="utf-8")
          PY

          # Incrustar el GIF para que GitHub no bloquee un recurso externo dentro del SVG.
          MII='https://github.com/user-attachments/assets/76df59b9-a1e1-4fe6-8c81-0acddd85b3a1'
          curl -fsSL --retry 3 --retry-delay 5 -o dist/mii.gif "$MII"
          base64 -w 0 dist/mii.gif > dist/mii.b64
          for banner in dist/banner-dark.svg dist/banner-light.svg dist/banner-en-dark.svg dist/banner-en-light.svg; do
            python3 - "$banner" dist/mii.b64 <<'PY'
          import pathlib
          import sys

          banner_path, gif_path = map(pathlib.Path, sys.argv[1:])
          banner = banner_path.read_text()
          gif_data = gif_path.read_text()
          image = (
              '<image x="675" y="20" width="150" height="150" '
              'preserveAspectRatio="xMidYMid meet" '
              f'href="data:image/gif;base64,{gif_data}"/>'
          )
          banner_path.write_text(banner.replace("</svg>", image + "</svg>", 1))
          PY
          done
          rm dist/mii.gif dist/mii.b64

      - name: Publicar en la rama "tema"
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: tema
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
