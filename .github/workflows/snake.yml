name: Generar snake de contribuciones

on:
  # Se actualiza cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:
  # Y cada vez que haces push a la rama principal
  push:
    branches:
      - main

permissions:
  contents: write

env:
  # Opta por Node 24 en las acciones de JavaScript (Node 20 ya fue retirado de los runners)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Subir a la rama "output"
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
