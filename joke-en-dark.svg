<svg xmlns="http://www.w3.org/2000/svg" width="640" height="92" viewBox="0 0 640 92" role="img" aria-label="Why do programmers confuse Halloween and Christmas? Because 31 in octal is 25 in decimal."><rect x="1.5" y="1.5" width="637" height="89" rx="12" fill="none" stroke="#5EEAD4" stroke-width="3"/><text x="24" y="36" font-family="Fira Code, Consolas, Menlo, monospace" font-size="15" fill="#e6edf3">Why do programmers confuse Halloween and Christmas? Because</text><text x="24" y="60" font-family="Fira Code, Consolas, Menlo, monospace" font-size="15" fill="#e6edf3">31 in octal is 25 in decimal.</text></svg>